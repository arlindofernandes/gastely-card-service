spring:
  datasource:
    url: ${CARD_DB_URL}
    username: ${CARD_DB_USERNAME}
    password: ${CARD_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

auth:
  jwt:
    jwk-set-uri: ${AUTH_JWK_SET_URI}
    issuer: ${AUTH_JWT_ISSUER}
    audience: ${AUTH_JWT_AUDIENCE}
