spring:
  datasource:
    url: ${CARD_DB_URL:jdbc:postgresql://localhost:${POSTGRES_EXTERNAL_PORT:5433}/${CARD_DB_NAME:carddb}}
    username: ${CARD_DB_USERNAME:card}
    password: ${CARD_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

auth:
  jwt:
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}
    issuer: ${AUTH_JWT_ISSUER:auth-service-dev}
    audience: ${AUTH_JWT_AUDIENCE:auth-service-clients}
